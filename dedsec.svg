    <clipPath id="k4"><rect x="229" y="453" height="22" width="0"><animate attributeName="width" calcMode="discrete" values="0;9;18;27;36;45;54;63;72;81;90;99;108" begin="11s" dur="1.04s" fill="freeze"/></rect></clipPath>
    <clipPath id="k5"><rect x="229" y="529" height="22" width="0"><animate attributeName="width" calcMode="discrete" values="0;9;18;27;36;45;54;63;72;81;90;99;108;117;126;135;144" begin="13.4s" dur="1.36s" fill="freeze"/></rect></clipPath>
    <clipPath id="k6"><rect x="229" y="659" height="22" width="0"><animate attributeName="width" calcMode="discrete" values="0;9;18;27;36" begin="16.2s" dur=".4s" fill="freeze"/></rect></clipPath>
