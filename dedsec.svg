    <clipPath id="k1"><rect x="229" y="193" height="22" width="0"><animate attributeName="width" calcMode="discrete" values="0;9;18;27;36;45;54" begin="3.3s" dur=".56s" fill="freeze"/></rect></clipPath>
    <clipPath id="k2"><rect x="229" y="247" height="22" width="0"><animate attributeName="width" calcMode="discrete" values="0;9;18;27;36;45;54;63;72;81;90;99;108;117;126;135;144;153;162;171;180;189" begin="5.1s" dur="1.76s" fill="freeze"/></rect></clipPath>
