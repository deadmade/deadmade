<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="726" viewBox="0 0 800 726" role="img" aria-labelledby="t">
  <title id="t">deadmade // DedSec terminal profile on deadPc</title>
  <!--
    Grid: 15px monospace forced to 9px per char via textLength, so typed text, clips and cursors line up in any font.
    Typing = clip rect / cursor stepping 9px per char (calcMode discrete), dur = (chars + 1) * 0.08s.
  -->
